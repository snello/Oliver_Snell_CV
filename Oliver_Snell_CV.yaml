      - label: 0-1 Builds
        details: Built several Product and Engineering teams from the ground up, one project that required building a team of four and launching the product in six months.
      - label: Developer-First & AI-Native
        details: Launched Prove's developer ecosystem; self-service tooling, billing, SDKs, and documentation, and subsequently retooled it to make LLM-based tools first-class citizens, enabling customers to discover and implement products through AI-assisted workflows. Embedded AI Agents that observe developer behavior in real time, detecting signals like dead ends and frustration patterns, and automatically surfacing code suggestions to resolve them. Accounts went live 75% faster with 100% less human intervention.

